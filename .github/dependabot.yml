version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      platform:
        patterns: ["roots/wordpress", "wp-plugin/*"]
      php-tools:
        dependency-type: development
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      wordpress-packages:
        patterns: ["@wordpress/*"]
      other:
        patterns: ["*"]
        exclude-patterns: ["@wordpress/*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
