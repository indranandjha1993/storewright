name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release again, such as v0.7.0
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: ci-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.inputs.tag || github.ref, 'refs/tags/') && github.event.inputs.tag == '' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: lint, analyse, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer lint
      - run: composer analyse
      - run: composer test

  stack:
    name: compose, install, seed, smoke
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: deploy/docker-compose.yml:docker/compose.ci.yml
    outputs:
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: version
        id: version
        run: echo "build=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: write .env
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-only-password/' .env
          for s in AUTH_KEY SECURE_AUTH_KEY LOGGED_IN_KEY NONCE_KEY AUTH_SALT SECURE_AUTH_SALT LOGGED_IN_SALT NONCE_SALT; do
            sed -i "s/^$s=.*/$s=$(openssl rand -hex 32)/" .env
          done
          printf 'DB_ROOT_PASSWORD=ci-only-root\nSTORE_NAME=storewright\nSTOREWRIGHT_VERSION=%s\n' "${{ steps.version.outputs.build }}" >> .env
          cp .env deploy/.env
      - uses: docker/setup-buildx-action@v4
      - name: build app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app/Dockerfile
          target: app
          load: true
          build-args: |
            STOREWRIGHT_VERSION=${{ steps.version.outputs.build }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.build }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app/Dockerfile
          target: web
          load: true
          build-args: |
            STOREWRIGHT_VERSION=${{ steps.version.outputs.build }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}-web:${{ steps.version.outputs.build }}
          cache-from: type=gha
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: deploy files
        run: |
          bash -n deploy/deploy.sh bin/install bin/release
          STOREWRIGHT_VERSION=ci docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config --quiet
      - run: make up
      - run: docker compose run --rm cli bin/install
      - run: make wp -- storewright templates
      - run: make seed
      - run: make pins
      - name: smoke
        run: |
          curl -fsS http://localhost:8600/health | tee /dev/stderr | grep -q '"ok":true'
          curl -fsS http://localhost:8600/version | tee /dev/stderr | grep -q '"version":"${{ steps.version.outputs.build }}"'
          curl -fsS http://localhost:8600/shop/ | grep -q 'themes/storewright/style.css'
          test "$(curl -fsS 'http://localhost:8600/wp-json/wc/store/v1/products?per_page=20' | jq length)" = "5"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8600/wp/xmlrpc.php)" = "403"
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/report
          retention-days: 7
      - if: failure()
        run: docker compose logs --no-color app web db | tail -200
      - name: keep the tested images
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:${{ steps.version.outputs.build }}"
          docker push "$IMAGE-web:${{ steps.version.outputs.build }}"

  release:
    name: images and release
    needs: stack
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: version
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          grep -q "^## ${tag#v} " CHANGELOG.md || { echo "CHANGELOG.md has no heading for ${tag#v}; run bin/release" >&2; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: pull the tested images
        run: |
          docker pull "$IMAGE:${{ needs.stack.outputs.build }}"
          docker pull "$IMAGE-web:${{ needs.stack.outputs.build }}"
      - name: start app once
        run: docker run --rm -e STOREWRIGHT_VERSION=${{ steps.version.outputs.version }} "$IMAGE:${{ needs.stack.outputs.build }}" sh -c 'sync-plugins && test -f web/app/plugins/woocommerce/.storewright-image && php-fpm -t'
      - name: scan app
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.stack.outputs.build }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: scan web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}-web:${{ needs.stack.outputs.build }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: promote
        run: |
          docker buildx imagetools create -t "$IMAGE:${{ steps.version.outputs.version }}" "$IMAGE:${{ needs.stack.outputs.build }}"
          docker buildx imagetools create -t "$IMAGE-web:${{ steps.version.outputs.version }}" "$IMAGE-web:${{ needs.stack.outputs.build }}"
      - name: release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          awk -v v="## $version " 'index($0, v) == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release create "$tag" --title "$version" --notes-file notes.md

  deploy:
    needs: release
    if: vars.DEPLOY_TARGETS != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(vars.DEPLOY_TARGETS || '["none"]') }}
    environment: ${{ matrix.target }}
    concurrency: deploy-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: ssh key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: update
        env:
          SERVER: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          FOLDER: ${{ secrets.DEPLOY_PATH }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          scp -q -i ~/.ssh/deploy deploy/deploy.sh deploy/docker-compose.yml deploy/Caddyfile deploy/.env.example "$SERVER:$FOLDER/"
          ssh -i ~/.ssh/deploy "$SERVER" "cd '$FOLDER' && ./deploy.sh update '$VERSION'"
