name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_call:
    outputs:
      build:
        description: the image tag the suite passed on, such as sha-1a2b3c4
        value: ${{ jobs.build.outputs.build }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository }}
  REF: ${{ github.event.inputs.tag || github.ref }}

jobs:
  check:
    name: lint, analyse, test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
      - name: php 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2
      - name: composer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
      - name: install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: lint (phpcs)
        run: composer lint
      - name: analyse (phpstan)
        run: composer analyse
      - name: unit tests (phpunit)
        run: composer test
      - name: summary
        run: echo "- lint, analysis and unit tests green on \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build the images
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
      - name: version
        id: version
        run: echo "build=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: check the deploy kit
        run: |
          bash -n deploy/deploy.sh bin/install bin/release
          cp deploy/.env.example deploy/.env
          STOREWRIGHT_VERSION=ci docker compose -f deploy/docker-compose.yml --env-file deploy/.env config --quiet
          rm deploy/.env
      - name: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app/Dockerfile
          target: app
          push: true
          build-args: |
            STOREWRIGHT_VERSION=${{ steps.version.outputs.build }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.build }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build and push web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app/Dockerfile
          target: web
          push: true
          build-args: |
            STOREWRIGHT_VERSION=${{ steps.version.outputs.build }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}-web:${{ steps.version.outputs.build }}
          cache-from: type=gha
      - name: summary
        env:
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          {
            echo "### Images"
            echo "- \`$IMAGE:$BUILD\`"
            echo "- \`$IMAGE-web:$BUILD\`"
          } >> "$GITHUB_STEP_SUMMARY"

  suite:
    name: suite ${{ matrix.project }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [mobile, desktop, admin]
    env:
      COMPOSE_FILE: deploy/docker-compose.yml:docker/compose.ci.yml
      PROJECT: ${{ matrix.project }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
      - name: store env
        uses: ./.github/actions/store-env
        with:
          version: ${{ needs.build.outputs.build }}
      - name: node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: install the test runner
        run: npm ci --no-audit --no-fund
      - name: store up
        uses: ./.github/actions/store-up
        with:
          version: ${{ needs.build.outputs.build }}
      - name: chromium
        run: npx playwright install --with-deps chromium
      - name: run the ${{ matrix.project }} project
        run: npx playwright test --project "$PROJECT" --no-deps
      - name: summary
        if: always()
        run: |
          test -f tests/e2e/results/summary.json || exit 0
          jq -r --arg p "$PROJECT" '.stats | "- \($p): \(.expected) passed, \(.unexpected) failed, \(.flaky) flaky, \(.skipped) skipped in \(.duration / 1000 | floor)s"' tests/e2e/results/summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: tests/e2e/report
          retention-days: 7
      - name: container logs
        if: failure()
        run: docker compose logs --no-color app web db | tail -200
