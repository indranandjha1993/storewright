name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_call:
    outputs:
      build:
        description: the image tag the suite passed on, such as sha-1a2b3c4
        value: ${{ jobs.stack.outputs.build }}

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: lint, analyse, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer lint
      - run: composer analyse
      - run: composer test

  stack:
    name: compose, install, seed, smoke
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: deploy/docker-compose.yml:docker/compose.ci.yml
    outputs:
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: version
        id: version
        run: echo "build=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: write .env
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-only-password/' .env
          for s in AUTH_KEY SECURE_AUTH_KEY LOGGED_IN_KEY NONCE_KEY AUTH_SALT SECURE_AUTH_SALT LOGGED_IN_SALT NONCE_SALT; do
            sed -i "s/^$s=.*/$s=$(openssl rand -hex 32)/" .env
          done
          printf 'DB_ROOT_PASSWORD=ci-only-root\nSTORE_NAME=storewright\nSTOREWRIGHT_VERSION=%s\n' "${{ steps.version.outputs.build }}" >> .env
          cp .env deploy/.env
      - uses: docker/setup-buildx-action@v4
      - name: build app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app/Dockerfile
          target: app
          load: true
          build-args: |
            STOREWRIGHT_VERSION=${{ steps.version.outputs.build }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.build }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app/Dockerfile
          target: web
          load: true
          build-args: |
            STOREWRIGHT_VERSION=${{ steps.version.outputs.build }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}-web:${{ steps.version.outputs.build }}
          cache-from: type=gha
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: deploy files
        run: |
          bash -n deploy/deploy.sh bin/install bin/release
          STOREWRIGHT_VERSION=ci docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config --quiet
      - run: make up
      - run: docker compose run --rm cli bin/install
      - run: make wp -- storewright templates
      - run: make seed
      - run: make pins
      - name: smoke
        run: |
          curl -fsS http://localhost:8600/health | tee /dev/stderr | grep -q '"ok":true'
          curl -fsS http://localhost:8600/version | tee /dev/stderr | grep -q '"version":"${{ steps.version.outputs.build }}"'
          curl -fsS http://localhost:8600/shop/ | grep -q 'themes/storewright/style.css'
          test "$(curl -fsS 'http://localhost:8600/wp-json/wc/store/v1/products?per_page=20' | jq length)" = "5"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8600/wp/xmlrpc.php)" = "403"
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/report
          retention-days: 7
      - if: failure()
        run: docker compose logs --no-color app web db | tail -200
      - name: keep the tested images
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:${{ steps.version.outputs.build }}"
          docker push "$IMAGE-web:${{ steps.version.outputs.build }}"
