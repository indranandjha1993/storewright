name: release
run-name: release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release again, such as v0.8.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  version:
    name: version from the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: read the tag
        id: version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error title=release::$TAG is not a vX.Y.Z tag"; exit 1; }
          version="${TAG#v}"
          grep -q "^## $version " CHANGELOG.md || { echo "::error file=CHANGELOG.md,title=release::no heading for $version; run bin/release"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "- releasing \`$version\` from tag \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: ci
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  scan:
    name: scan ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            suffix: ""
          - image: web
            suffix: -web
    env:
      REF_IMAGE: ghcr.io/${{ github.repository }}${{ matrix.suffix }}:${{ needs.verify.outputs.build }}
    steps:
      - name: pull the tested image
        run: docker pull "$REF_IMAGE"
      - name: start the app once
        if: matrix.image == 'app'
        run: docker run --rm -e STOREWRIGHT_VERSION=release "$REF_IMAGE" sh -c 'sync-plugins && test -f web/app/plugins/woocommerce/.storewright-image && php-fpm -t'
      - name: trivy, critical and fixable only
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REF_IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: summary
        run: echo "- \`$REF_IMAGE\` has no fixable critical finding" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish ${{ needs.version.outputs.version }}
    needs: [version, scan, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      BUILD: ${{ needs.verify.outputs.build }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: promote the tested images to the version
        run: |
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:$BUILD"
          docker buildx imagetools create -t "$IMAGE-web:$VERSION" "$IMAGE-web:$BUILD"
      - name: github release from the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          awk -v v="## $VERSION " 'index($0, v) == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "$VERSION" --notes-file notes.md
      - name: summary
        run: |
          {
            echo "### Published $VERSION"
            echo "- \`$IMAGE:$VERSION\` and \`$IMAGE-web:$VERSION\` point at the tested \`$BUILD\` images"
            echo "- release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy to ${{ matrix.target }}
    needs: [version, publish]
    if: vars.DEPLOY_TARGETS != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(vars.DEPLOY_TARGETS || '["none"]') }}
    environment: ${{ matrix.target }}
    concurrency: deploy-${{ matrix.target }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: ssh key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: send the deploy kit and update
        env:
          SERVER: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          FOLDER: ${{ secrets.DEPLOY_PATH }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          scp -q -i ~/.ssh/deploy deploy/deploy.sh deploy/docker-compose.yml deploy/Caddyfile deploy/.env.example "$SERVER:$FOLDER/"
          ssh -i ~/.ssh/deploy "$SERVER" "cd '$FOLDER' && ./deploy.sh update '$VERSION'"
      - name: summary
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: echo "- $TARGET is on $VERSION" >> "$GITHUB_STEP_SUMMARY"
