name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, such as v0.2.0
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: version
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          target: app
          load: true
          build-args: |
            STOREWRIGHT_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ steps.version.outputs.sha }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          target: web
          load: true
          build-args: |
            STOREWRIGHT_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ steps.version.outputs.sha }}
          tags: ${{ env.IMAGE }}-web:${{ steps.version.outputs.version }}
          cache-from: type=gha
      - name: scan app
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: scan web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}-web:${{ steps.version.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: push
        run: |
          docker push "$IMAGE:${{ steps.version.outputs.version }}"
          docker push "$IMAGE-web:${{ steps.version.outputs.version }}"
      - name: release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          awk -v v="## $version " 'index($0, v) == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release create "$tag" --title "$version" --notes-file notes.md

  deploy:
    needs: images
    if: vars.DEPLOY_TARGETS != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(vars.DEPLOY_TARGETS || '["none"]') }}
    environment: ${{ matrix.target }}
    concurrency: deploy-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.images.outputs.tag }}
      - name: ssh key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: update
        env:
          SERVER: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          FOLDER: ${{ secrets.DEPLOY_PATH }}
          VERSION: ${{ needs.images.outputs.version }}
        run: |
          scp -q -i ~/.ssh/deploy deploy/deploy.sh deploy/docker-compose.yml deploy/Caddyfile deploy/.env.example "$SERVER:$FOLDER/"
          ssh -i ~/.ssh/deploy "$SERVER" "cd '$FOLDER' && ./deploy.sh update '$VERSION'"
