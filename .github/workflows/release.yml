name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release again, such as v0.8.0
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: ci
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  release:
    name: images and release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: version
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          grep -q "^## ${tag#v} " CHANGELOG.md || { echo "CHANGELOG.md has no heading for ${tag#v}; run bin/release" >&2; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: pull the tested images
        run: |
          docker pull "$IMAGE:${{ needs.verify.outputs.build }}"
          docker pull "$IMAGE-web:${{ needs.verify.outputs.build }}"
      - name: start app once
        run: docker run --rm -e STOREWRIGHT_VERSION=${{ steps.version.outputs.version }} "$IMAGE:${{ needs.verify.outputs.build }}" sh -c 'sync-plugins && test -f web/app/plugins/woocommerce/.storewright-image && php-fpm -t'
      - name: scan app
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.verify.outputs.build }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: scan web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}-web:${{ needs.verify.outputs.build }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: promote
        run: |
          docker buildx imagetools create -t "$IMAGE:${{ steps.version.outputs.version }}" "$IMAGE:${{ needs.verify.outputs.build }}"
          docker buildx imagetools create -t "$IMAGE-web:${{ steps.version.outputs.version }}" "$IMAGE-web:${{ needs.verify.outputs.build }}"
      - name: release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          awk -v v="## $version " 'index($0, v) == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release create "$tag" --title "$version" --notes-file notes.md

  deploy:
    needs: release
    if: vars.DEPLOY_TARGETS != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(vars.DEPLOY_TARGETS || '["none"]') }}
    environment: ${{ matrix.target }}
    concurrency: deploy-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: ssh key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: update
        env:
          SERVER: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          FOLDER: ${{ secrets.DEPLOY_PATH }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          scp -q -i ~/.ssh/deploy deploy/deploy.sh deploy/docker-compose.yml deploy/Caddyfile deploy/.env.example "$SERVER:$FOLDER/"
          ssh -i ~/.ssh/deploy "$SERVER" "cd '$FOLDER' && ./deploy.sh update '$VERSION'"
