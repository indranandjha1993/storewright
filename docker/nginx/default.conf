gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

limit_req_zone $binary_remote_addr zone=storewright_login:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php app:9000;
    root /var/www/html/web;
    index index.php;
    client_max_body_size 64m;
    server_tokens off;
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location = /wp/wp-admin {
        return 301 /wp/wp-admin/;
    }

    location = /wp/wp-login.php {
        return 404;
    }

    location ~ ^/wp/(readme\.html|license\.txt|wp-cron\.php|wp-config\.php|wp-admin/(install|upgrade|setup-config)\.php)$ {
        return 404;
    }

    location ~ ^/wp/wp-includes/.+\.php$ {
        return 404;
    }

    location ~ ^/(composer\.(json|lock)|package(-lock)?\.json|phpcs\.xml|phpstan\.neon|phpunit\.xml(\.dist)?|Makefile|docker-compose\.yml)$ {
        return 404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $php;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    location = /wp/xmlrpc.php {
        deny all;
    }

    location ~ ^/sign-in/?$ {
        limit_req zone=storewright_login burst=30 nodelay;
        try_files $uri /index.php?$args;
    }
}
