services:
  web:
    ports: !override
      - "${WEB_PORT:-8600}:80"

  mail:
    image: axllent/mailpit:latest
    ports:
      - "${MAIL_PORT:-8601}:8025"

  # Paths resolve against the first compose file, so the pipeline copies .env next to it.
  cli:
    image: ${STOREWRIGHT_IMAGE:-ghcr.io/indranandjha1993/storewright}:${STOREWRIGHT_VERSION:?set by the pipeline}
    profiles: ["tools"]
    env_file: .env
    volumes:
      - uploads:/var/www/html/web/app/uploads
      - type: volume
        source: plugins
        target: /var/www/html/web/app/plugins
        volume:
          nocopy: true
      - languages:/var/www/html/web/app/languages
    depends_on:
      db:
        condition: service_healthy
    entrypoint: []
    command: ["bash"]
