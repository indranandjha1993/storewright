name: storewright

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
    image: storewright-app:dev
    user: "${HOST_UID:-82}:${HOST_GID:-82}"
    env_file: .env
    environment:
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
      COMPOSER_HOME: /tmp/composer
      WP_CLI_CACHE_DIR: /tmp/wp-cli
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8600}:80"
    volumes:
      - ./web:/var/www/html/web:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_NAME:-storewright}
      MARIADB_USER: ${DB_USER:-storewright}
      MARIADB_PASSWORD: ${DB_PASSWORD:-storewright}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:${DB_PORT:-8602}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  mail:
    image: axllent/mailpit:latest
    ports:
      - "${MAIL_PORT:-8601}:8025"

  cron:
    image: storewright-app:dev
    user: "${HOST_UID:-82}:${HOST_GID:-82}"
    env_file: .env
    environment:
      WP_CLI_CACHE_DIR: /tmp/wp-cli
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    entrypoint: []
    command: ["sh", "-c", "while true; do wp cron event run --due-now --quiet || true; sleep 60; done"]

  cli:
    image: storewright-app:dev
    profiles: ["tools"]
    user: "${HOST_UID:-82}:${HOST_GID:-82}"
    env_file: .env
    environment:
      COMPOSER_HOME: /tmp/composer
      WP_CLI_CACHE_DIR: /tmp/wp-cli
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    entrypoint: []
    command: ["bash"]

volumes:
  db_data:
